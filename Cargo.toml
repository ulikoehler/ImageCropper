[package]
name = "imagecropper"
version = "0.4.1"
edition = "2021"
homepage = "https://github.com/ulikoehler/ImageCropper"
repository = "https://github.com/ulikoehler/ImageCropper"
description = "Batch interactive image cropper with multicrop support"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }
fast_image_resize = "6"
globset = "0.4"
img-parts = "0.4.0"
kamadak-exif = "0.6.1"
rand = "0.10"
regex = "1"
walkdir = "2.5"
ctrlc = "3"
wgpu = { version = "30", features = ["vulkan", "gles"] }
zune-jpeg = "0.5"

# Web server (--serve / -G headless modes)
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lru = "0.19"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
webbrowser = "1"

[target.'cfg(not(target_os = "windows"))'.dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "gif", "ico", "tiff", "webp", "avif", "avif-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "gif", "ico", "tiff", "webp", "avif"] }

[dev-dependencies]
once_cell = "1"
tempfile = "3"
tokio-tungstenite = "0.30"

[build-dependencies]
cc = "1"
pkg-config = "0.3"
