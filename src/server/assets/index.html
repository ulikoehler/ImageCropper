<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>ImageCropper</title>
<style>
  html,body{margin:0;height:100%;background:#111;overflow:hidden}
  canvas{display:block;position:absolute;inset:0}
  #hud{position:absolute;left:0;right:0;bottom:0;display:flex;
       justify-content:space-between;color:#eee;font:13px/1.4 system-ui;
       padding:6px 10px;background:rgba(0,0,0,.55);pointer-events:none}
  #top{position:absolute;left:0;top:0;color:#eee;font:13px/1.4 system-ui;
       padding:6px 10px;background:rgba(0,0,0,.55);pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top"></div>
<div id="hud"><span id="status"></span><span id="help"></span></div>
<script src="/app.js"></script>
</body>
</html>
